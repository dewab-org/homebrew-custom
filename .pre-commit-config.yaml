repos:
  - repo: local
    hooks:
      - id: brew-style-audit
        name: Brew style & audit (formulae/casks)
        entry: scripts/run-brew-checks.sh
        language: system
        files: '^(Formula|Casks)/.*\.rb$'
        pass_filenames: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
